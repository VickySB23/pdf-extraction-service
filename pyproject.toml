[project]
name = "extraction-service"
version = "1.0.2"
description = "Microservicio stateless: extrae el texto de un PDF y lo devuelve en Markdown"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2,<1",
    "httpx>=0.28.1,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pymupdf>=2.1,<3",
    "python-multipart>=0.0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "cryptography>=50.0.2,<51",
    "pypdf>=7.1.0,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
